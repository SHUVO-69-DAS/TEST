    <title>SHUVO DAS</title>

    <!-- Instant Piano Audio Unlocker & Default ON Enforcer -->
    <script>
      (function () {
        try {
          localStorage.setItem("shuvo_rebuild_sound", "on");
        } catch (e) {}

        window.__unlockShuvoAudio = function () {
          var Ctx = window.AudioContext || window.webkitAudioContext;
          if (!Ctx) return;
          if (!window.__shuvoPrewarmCtx) {
            try {
              window.__shuvoPrewarmCtx = new Ctx();
            } catch (e) {}
          }
          if (window.__shuvoPrewarmCtx && window.__shuvoPrewarmCtx.state === "suspended") {
            window.__shuvoPrewarmCtx.resume().catch(function () {});
          }
        };

        window.__unlockShuvoAudio();
        ["pointerdown", "touchstart", "mousedown", "keydown", "scroll", "mousemove"].forEach(function (evt) {
          window.addEventListener(evt, window.__unlockShuvoAudio, { once: true, passive: true, capture: true });
        });
      })();
    </script>
