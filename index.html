<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="preconnect" href="https://i.ibb.co" crossorigin />
    <link rel="preconnect" href="https://images.unsplash.com" crossorigin />
    <link rel="dns-prefetch" href="https://i.ibb.co" />
    <link rel="dns-prefetch" href="https://images.unsplash.com" />

    <!-- Fonts: preconnect + load directly from <head> instead of a CSS @import.
         An @import inside index.css forces the browser to fetch and parse the
         CSS bundle FIRST before it even discovers the font request, adding a
         full extra round trip before text can render. Declaring it here lets
         the browser's preload scanner start the font fetch immediately, in
         parallel with the JS bundle — this is what was slowing down FCP/LCP. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&family=Space+Grotesk:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500;700&display=swap"
    />

    <!-- Preload the hero profile photo: it's the page's actual LCP element,
         so tell the browser to fetch it at the highest priority as soon as
         the HTML is parsed, instead of waiting for React to mount and the
         <img> tag to be discovered. -->
    <link
      rel="preload"
      as="image"
      href="https://i.ibb.co/hRZLvzr9/720-720.jpg"
      fetchpriority="high"
    />

    <link rel="icon" type="image/jpeg" href="https://i.ibb.co.com/Dg1Nh9Wd/500-500.jpg" />
    <title>SHUVO DAS</title>
    <script type="module" crossorigin src="./assets/index-DMVZa_Hg.js"></script>
    <link rel="stylesheet" crossorigin href="./assets/index-axDYoM6S.css">
  </head>
  <body>
    <div id="root"></div>
  </body>
</html>
